plugins {
    id "com.android.application"
}

android {
    namespace "com.example.weddingcountdown"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.weddingcountdown.v2"
        minSdk 14
        targetSdk 28
        versionCode 5
        versionName "2.4.0"
    }

    signingConfigs {
        dev {
            storeFile file("../keystore/wedding-debug.keystore")
            storePassword "wedding-countdown-dev"
            keyAlias "weddingcountdown"
            keyPassword "wedding-countdown-dev"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.dev
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
